[theme]
base = "light"
primaryColor = "#17332A"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#ECE6D6"
textColor = "#1D2A22"
font = "sans serif"

[server]
maxUploadSize = 25

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false     # no Streamlit usage analytics (see Privacy page)
