<!doctype html>
<!-- Lawn brush: paint / erase the lawn mask on top of the photo.
     A tiny Streamlit custom component written without a build step: it speaks
     Streamlit's postMessage protocol directly. Returns {png, n} after every stroke. -->
<html><head><meta charset="utf-8">
<style>
  :root { --forest:#17332A; --moss:#2E5A43; --lime:#D3E27A; --linen:#F4F1EA; --clay:#C26A3D; --muted:#6E6B5E; }
  html, body { margin:0; background:transparent; font-family: Inter, system-ui, sans-serif; }
  .bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.6rem; }
  .seg { display:inline-flex; background:#fff; border:1px solid #DDD5C2; border-radius:999px; padding:3px; }
  .seg button { border:0; background:transparent; padding:.45rem .95rem; border-radius:999px; font:600 .86rem Inter, sans-serif;
                color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--forest); color:var(--linen); }
  .seg button.on.erase { background:var(--clay); }
  .size { display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--muted); margin-left:.3rem; }
  input[type=range] { accent-color: var(--moss); width:110px; }
  .ghost { border:1px solid #DDD5C2; background:#fff; border-radius:999px; padding:.42rem .9rem; font:600 .84rem Inter, sans-serif;
           color:#1D2A22; cursor:pointer; }
  .ghost:disabled { opacity:.4; cursor:default; }
  .wrap { position:relative; border-radius:14px; overflow:hidden; touch-action:none; line-height:0; }
  canvas { width:100%; height:auto; display:block; cursor:crosshair; }
  .hint { font-size:.8rem; color:var(--muted); margin-top:.45rem; line-height:1.4; }
</style></head>
<body>
  <div class="bar">
    <div class="seg"><button id="fill" class="on">◯ Outline</button><button id="paint">🖌 Paint</button><button id="erase">✕ Erase</button></div>
    <div class="size">Brush <input id="size" type="range" min="8" max="90" value="50"></div>
    <button id="undo" class="ghost" disabled>↶ Undo</button>
  </div>
  <div class="wrap"><canvas id="view"></canvas></div>
  <div class="hint" id="hint">Draw a loop around the grass you want to replace. Use Paint to add bits, Erase to remove trees, paths or shrubs.</div>
<script>
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
const view = document.getElementById("view"), ctx = view.getContext("2d");
const mask = document.createElement("canvas"), mctx = mask.getContext("2d");
const tint = document.createElement("canvas"), tctx = tint.getContext("2d");
const photo = new Image();
let mode = "fill", size = 50, drawing = false, last = null, hover = null, undo = [], strokes = 0, loadedKey = null;

function render() {
  ctx.clearRect(0, 0, view.width, view.height);
  ctx.drawImage(photo, 0, 0, view.width, view.height);
  // tint = mask filled with clay at 45% opacity
  tctx.clearRect(0, 0, tint.width, tint.height);
  tctx.globalCompositeOperation = "source-over"; tctx.drawImage(mask, 0, 0);
  tctx.globalCompositeOperation = "source-in"; tctx.fillStyle = "rgba(194,106,61,0.5)";
  tctx.fillRect(0, 0, tint.width, tint.height);
  ctx.drawImage(tint, 0, 0);
  if (loop.length > 1) {              // outline being drawn
    ctx.beginPath(); ctx.moveTo(loop[0].x, loop[0].y); for (const q of loop) ctx.lineTo(q.x, q.y);
    ctx.closePath(); ctx.fillStyle = "rgba(211,226,122,0.25)"; ctx.fill();
    ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]); ctx.strokeStyle = "#D3E27A"; ctx.stroke(); ctx.setLineDash([]);
  }
  if (hover && mode !== "fill") {                       // brush preview ring
    ctx.beginPath(); ctx.arc(hover.x, hover.y, size / 2 * scale(), 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = mode === "paint" ? "#D3E27A" : "#ffffff"; ctx.stroke();
  }
}
const scale = () => view.width / view.getBoundingClientRect().width;   // CSS px → canvas px
function pos(e) {
  const r = view.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
  return {x: (p.clientX - r.left) * scale(), y: (p.clientY - r.top) * scale()};
}
function dab(a, b) {
  mctx.globalCompositeOperation = mode === "paint" ? "source-over" : "destination-out";
  mctx.strokeStyle = "#fff"; mctx.fillStyle = "#fff"; mctx.lineCap = "round"; mctx.lineJoin = "round";
  mctx.lineWidth = size * scale();
  mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
}
function start(e) {
  e.preventDefault();
  undo.push(mctx.getImageData(0, 0, mask.width, mask.height)); if (undo.length > 25) undo.shift();
  document.getElementById("undo").disabled = false;
  drawing = true; last = pos(e);
  if (mode === "fill") { loop = [last]; render(); return; }
  dab(last, last); render();
}
// Outline: drag a loop around the lawn; on release everything inside is filled.
let loop = [];
function fillLoop() {
  if (loop.length > 2) {
    mctx.globalCompositeOperation = "source-over"; mctx.fillStyle = "#fff";
    mctx.beginPath(); mctx.moveTo(loop[0].x, loop[0].y); for (const q of loop) mctx.lineTo(q.x, q.y);
    mctx.closePath(); mctx.fill();
  }
  loop = [];
}
function move(e) {
  hover = pos(e);
  if (drawing) { e.preventDefault(); const p = pos(e); if (mode === "fill") loop.push(p); else dab(last, p); last = p; }
  render();
}
function end() { if (!drawing) return; drawing = false; if (mode === "fill") { fillLoop(); render(); } commit(); }
function commit() { strokes += 1; send("streamlit:setComponentValue", {value: {png: mask.toDataURL("image/png"), n: strokes}, dataType: "json"}); }

view.addEventListener("mousedown", start); view.addEventListener("touchstart", start, {passive: false});
window.addEventListener("mousemove", move); view.addEventListener("touchmove", move, {passive: false});
window.addEventListener("mouseup", end); view.addEventListener("touchend", end);
view.addEventListener("mouseleave", () => { hover = null; render(); });

const setMode = m => {
  mode = m;
  document.getElementById("paint").className = m === "paint" ? "on" : "";
  document.getElementById("erase").className = m === "erase" ? "on erase" : "";
  document.getElementById("fill").className = m === "fill" ? "on" : "";
  view.style.cursor = m === "fill" ? "crosshair" : "none";
};
document.getElementById("fill").onclick = () => setMode("fill");
document.getElementById("paint").onclick = () => setMode("paint");
document.getElementById("erase").onclick = () => setMode("erase");
document.getElementById("size").oninput = e => { size = +e.target.value; render(); };
document.getElementById("undo").onclick = () => {
  if (!undo.length) return; mctx.putImageData(undo.pop(), 0, 0);
  document.getElementById("undo").disabled = !undo.length; render(); commit();
};

window.addEventListener("message", e => {
  if (e.data.type !== "streamlit:render") return;
  const a = e.data.args;
  if (a.ver === loadedKey) return;            // only (re)load when Python sends a new mask version
  loadedKey = a.ver;
  photo.onload = () => {
    view.width = mask.width = tint.width = a.width; view.height = mask.height = tint.height = a.height;
    const m = new Image();
    m.onload = () => { mctx.clearRect(0, 0, mask.width, mask.height); mctx.drawImage(m, 0, 0, a.width, a.height);
                      undo = []; document.getElementById("undo").disabled = true; render();
                      send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4}); };
    m.src = a.mask;
  };
  photo.src = a.photo;
});
new ResizeObserver(() => send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4})).observe(document.body);
send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
